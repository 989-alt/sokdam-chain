# 저장소 루트 기준 경로. new-edu-game/ 를 subtree split 한 저장소에서만 동작한다 (docs/new-edu-game/배포.md).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x  # 로컬 개발(24.21)과 같게 — Node 20 은 Event.returnValue 가 읽기 전용이라 flow.test 가 깨짐
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_BASE: /sokdam-chain/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
